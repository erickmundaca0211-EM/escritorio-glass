import com.android.build.api.artifact.SingleArtifact

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 36
    namespace "cu.axel.smartdock"
	
    defaultConfig {
        // Escritorio Glass: own applicationId; the Kotlin namespace stays as upstream to ease merges
        applicationId "pe.vega.escritorioglass"
        minSdk 30
        targetSdk 36
        versionCode 1150
        versionName "1.15.0"
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        aidl true
    }
    dependenciesInfo {
        includeInApk true
        includeInBundle true
    }
}

dependencies {
	implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.github.ChickenHook:RestrictionBypass:2.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

// ---------------------------------------------------------------------------------------------
// Security rule 1 (CLAUDE.md): the app must never get android.permission.INTERNET.
// The merged manifest (app + every dependency) of every variant goes through this transform
// before packaging, so assemble/install/bundle all fail if the permission shows up.
// Do not remove or disable this check.
// ---------------------------------------------------------------------------------------------
abstract class VerifyNoInternetPermissionTask extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getMergedManifest()

    @OutputFile
    abstract RegularFileProperty getVerifiedManifest()

    @TaskAction
    void verify() {
        File input = mergedManifest.get().asFile
        def manifest = new groovy.xml.XmlSlurper(false, false).parse(input)
        def forbidden = manifest.children().findAll {
            (it.name() == 'uses-permission' || it.name() == 'uses-permission-sdk-23') &&
                    it.'@android:name'.text() == 'android.permission.INTERNET'
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    "android.permission.INTERNET found in the merged manifest (${input}).\n" +
                    "Escritorio Glass must never have internet access (CLAUDE.md, security rule 1).\n" +
                    "Find the dependency that adds it with :app:process<Variant>Manifest and the " +
                    "manifest-merger report, then remove it or add tools:node=\"remove\" on purpose.")
        }
        verifiedManifest.get().asFile.bytes = input.bytes
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def verifyTask = project.tasks.register(
                "verify${variant.name.capitalize()}NoInternetPermission",
                VerifyNoInternetPermissionTask)
        variant.artifacts.use(verifyTask)
                .wiredWithFiles({ it.mergedManifest }, { it.verifiedManifest })
                .toTransform(SingleArtifact.MERGED_MANIFEST.INSTANCE)
    }
}
